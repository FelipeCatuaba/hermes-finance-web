<div class="layout-shell">
  <aside class="sidebar" [ngClass]="{ open: mobileMenuOpen() }">
    <a routerLink="/dashboard" class="brand" (click)="closeMobileMenu()">
      <img src="assets/Hermes_logo.png" alt="Hermes" class="brand-logo" />
      <span>HERMES</span>
    </a>
    <p class="brand-tag">gestão financeira</p>

    <div class="month-wrap">
      <ui-month-selector />
    </div>

    <nav class="menu" aria-label="Navegacao principal">
      <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" (click)="closeMobileMenu()">{{ item.label }}</a>
    </nav>

    <div class="sidebar-footer">
      <ui-button variant="secondary" (click)="logout()">Sair</ui-button>
    </div>
  </aside>

  <div class="layout-main">
    <header class="topbar">
      <button type="button" class="menu-trigger" aria-label="Abrir menu" (click)="toggleMobileMenu()">☰</button>
      <div>
        <p class="top-label">Painel Financeiro</p>
        <strong>Abrangência mensal</strong>
      </div>
    </header>

    <main class="layout-content">
      <router-outlet />
    </main>

    <app-new-expense-fab />

    <nav class="bottom-nav" aria-label="Navegacao principal mobile">
      <a *ngFor="let item of bottomNavItems" [routerLink]="item.path" routerLinkActive="active">
        <i class="bi" [ngClass]="item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </div>
</div>

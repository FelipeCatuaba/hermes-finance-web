<section class="settings-stack">
  <header>
    <h1>Configurações</h1>
    <p>Gerencie membros, categorias, orçamento e segurança da conta.</p>
  </header>

  @if (snapshot$ | async; as snapshot) {
    <div class="settings-grid">
      <ui-card class="panel">
        <h2>Membros da família</h2>
        <ul class="plain-list">
          <li *ngFor="let member of snapshot.familyMembers">{{ member }}</li>
        </ul>
      </ui-card>

      <ui-card class="panel">
        <h2>Categorias</h2>
        <ul class="plain-list">
          <li *ngFor="let category of snapshot.categories">{{ category }}</li>
        </ul>
      </ui-card>

      <ui-card class="panel budget-panel">
        <h2>Orçamento mensal</h2>
        <p class="value">{{ snapshot.monthlyBudget }}</p>
      </ui-card>

      <ui-card class="panel">
        <h2>Segurança</h2>
        <p class="security-copy">{{ snapshot.securityLabel }}</p>
      </ui-card>
    </div>
  }
</section>
